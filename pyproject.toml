[project]
name = "mmm-framework"
version = "0.1.0"
description = "Modular Marketing Mix Modeling framework using pymc-marketing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymc-marketing>=0.8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "holidays>=0.46",
    "pytrends>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov",
]
bigquery = [
    "google-cloud-bigquery>=3.0",
    "db-dtypes",
]

[project.scripts]
agent-mmm = "agent_mmm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
